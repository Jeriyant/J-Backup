Alias "@@APP_URL_PATH@@/" "@@APP_DIR@@/"

<Directory "@@APP_DIR@@">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    SetEnv JBACKUP_DATA_DIR "@@DATA_DIR@@"
    SetEnv JBACKUP_BACKUP_DIR "@@BACKUP_DIR@@"

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(?:md|sqlite|key|log|ini|service|timer|conf|sh)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(?!index\.php$|api\.php$).+\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^@@APP_DIR_REGEX@@/(?:bin|deploy|src|storage|tests|scripts)(?:/|$)">
    Require all denied
</DirectoryMatch>

<Directory "@@DATA_DIR@@">
    Require all denied
</Directory>

<Directory "@@APP_DIR@@/assets">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
