<Directory /var/www/html/J-Backup>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    SetEnv JBACKUP_DATA_DIR /var/www/html/J-Backup/storage

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(?:md|sqlite|key|log|ini|service|timer|conf|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/J-Backup/(?:bin|deploy|src|storage|tests|scripts)(?:/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/www/html/J-Backup/assets>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
