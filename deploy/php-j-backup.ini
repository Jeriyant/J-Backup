; J-BACKUP menerima arsip backup besar melalui File Explorer.
upload_max_filesize = 8G
post_max_size = 8G
max_file_uploads = 10
; Default bound so hung PHP workers cannot occupy Apache forever.
; Long upload/download/update paths call set_time_limit(0) explicitly.
max_execution_time = 120
max_input_time = -1
session.lazy_write = 1
session.use_strict_mode = 1
